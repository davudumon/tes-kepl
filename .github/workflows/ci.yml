name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - 'feature/**' # Menangkap branch fitur
      - dev
  pull_request:
    branches: [ main ]

jobs:
  # TAHAP 1: BUILD
  build:
    name: Build Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2' # Sesuaikan dengan versi PHP kamu

      - name: Install Dependencies (Composer)
        run: composer install --prefer-dist --no-progress --no-suggest

  # TAHAP 2: TEST
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build # Menunggu job build selesai
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          
      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"
        
      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Run tests
        run: php artisan test

  # TAHAP 3: STAGING
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test # Menunggu job test selesai (hijau)
    steps:
      - name: Echo Staging Deploy
        run: echo "Deploying to Staging Environment... Success!"

  # TAHAP 4: PRODUCTION
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate 7 Steps Deploy (Echo)
        run: |
          echo "cd /var/www/aplikasi"
          echo "# 1 · Kunci pintu — tampilkan halaman pemeliharaan"
          echo "php artisan down --retry=60"
          echo "# 2 · Ambil kode terbaru"
          echo "git pull origin main"
          echo "# 3 · Pasang dependensi (tanpa paket dev)"
          echo "composer install --no-dev --optimize-autoloader"
          echo "# 4 · Ubah skema basis data. --force = jangan tanya"
          echo "php artisan migrate --force"
          echo "# 5 · Bangun ulang cache dengan kode & config baru"
          echo "php artisan config:cache && php artisan route:cache && php artisan view:cache"
          echo "# 6 · Muat ulang pekerja antrean"
          echo "php artisan queue:restart"
          echo "# 7 · Buka pintu kembali"
          echo "php artisan up"