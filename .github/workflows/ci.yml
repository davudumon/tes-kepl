name: Laravel CI/CD

on:
  push:
    branches: [ main, dev, 'feature/**', 'fitur/**' ]
  pull_request:
    branches: [ main ]

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Build – pasang dependensi
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, sqlite3
          coverage: none

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install dependencies (composer install)
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare environment
        run: cp .env.example .env

      - name: Upload vendor artifact
        uses: actions/upload-artifact@v4
        with:
          name: vendor
          path: vendor/

  # ──────────────────────────────────────────────
  # Job 2: Test – jalankan php artisan test
  # ──────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader
      - name: Run Laravel test suite
        run: php artisan test

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, json, bcmath, sqlite3
          coverage: none

      - name: Download vendor artifact
        uses: actions/download-artifact@v4
        with:
          name: vendor
          path: vendor/

      - name: Prepare environment
        run: cp .env.example .env

      - name: Run tests (php artisan test)
        run: php artisan test --parallel

  # ──────────────────────────────────────────────
  # Job 3: Staging – simulasi deploy ke staging
  # ──────────────────────────────────────────────
  staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate staging deployment
        run: |
          echo "============================================"
          echo "  DEPLOYING TO STAGING ENVIRONMENT"
          echo "============================================"
          echo "Branch   : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Actor    : ${{ github.actor }}"
          echo "Time     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo ""
          echo ">> Staging deployment completed (simulated)"
          echo "============================================"

  # ──────────────────────────────────────────────
  # Job 4: Production – deploy ke production
  #   - Hanya jalan dari branch main
  #   - Menggunakan environment 'production' (required reviewer)
  #   - Menjalankan 7 langkah deploy.sh sebagai echo
  # ──────────────────────────────────────────────
  production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: staging
    if: github.ref == 'refs/heads/main'
    environment:
      name: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: "[1/7] Maintenance mode + pull latest code"
        run: |
          echo "[1/7] Kunci pintu (maintenance mode) lalu tarik kode terbaru..."
          echo "  - php artisan down --retry=60"
          echo "  - git pull origin main"

      - name: "[2/7] Install dependencies"
        run: echo "[2/7] Installing/updating dependencies (composer install --no-dev)..."

      - name: "[3/7] Run database migrations"
        run: echo "[3/7] Running database migrations (php artisan migrate --force)..."

      - name: "[4/7] Cache configuration, routes, and views"
        run: |
          echo "[4/7] Caching configuration, routes, and views..."
          echo "  - php artisan config:cache"
          echo "  - php artisan route:cache"
          echo "  - php artisan view:cache"

      - name: "[5/7] Build frontend assets"
        run: echo "[5/7] Installing and building frontend assets (npm ci && npm run build)..."

      - name: "[6/7] Restart queue workers"
        run: echo "[6/7] Restarting queue workers (php artisan queue:restart)..."

      - name: "[7/7] Open the door back up"
        run: |
          echo "[7/7] Buka pintu kembali (php artisan up)..."
          echo ""
          echo "============================================"
          echo "  PRODUCTION DEPLOY SELESAI"
          echo "============================================"
          echo "Branch   : ${{ github.ref_name }}"
          echo "Commit   : ${{ github.sha }}"
          echo "Actor    : ${{ github.actor }}"
          echo "Time     : $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
